<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鮭鮭熊 · 超任盒帶貼紙</title>
    <style>
      :root { --ink:#1f2a1c; --green:#24563a; --gold:#b08a3c; --paper:#f4efe4; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:"PingFang TC","Noto Sans TC",sans-serif; background:var(--paper); color:var(--ink); line-height:1.45; }
      main { max-width:920px; margin:0 auto; padding:28px 20px 64px; }
      nav a { color:var(--green); margin-right:14px; text-decoration:none; font-weight:700; }
      h1 { margin:18px 0 6px; font-size:28px; letter-spacing:.08em; color:var(--green); }
      h2 { margin:36px 0 8px; font-size:22px; color:var(--green); letter-spacing:.06em; }
      .sub { color:#5a6456; margin-bottom:24px; }
      .lead { color:#5a6456; margin:0 0 18px; }
      .sticker { width:100%; height:auto; border-radius:14px; display:block; background:#fff; }
      .spec { margin:20px 0 24px; font-size:15px; }
      .spec b { color:var(--green); }
      .btns { display:flex; flex-wrap:wrap; gap:12px; }
      a.btn { display:inline-block; background:var(--green); color:#fff8e8; text-decoration:none; padding:12px 18px; border-radius:10px; font-weight:700; }
      a.btn.gold { background:var(--gold); color:#1f180c; }
      .making-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
      @media (max-width:640px) { .making-grid { grid-template-columns:1fr; } }
      .making-card { background:#fff; border-radius:12px; overflow:hidden; border:1px solid #d9d2c4; }
      .making-card img { display:block; width:100%; height:auto; }
      .making-card figcaption { padding:10px 12px 14px; font-size:14px; color:#3a4436; }
      .making-slot { min-height:48px; border:2px dashed #c5bda8; border-radius:12px; display:grid; place-items:center; color:#8a8374; font-size:13px; margin-top:12px; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="/">遊戲</a>
        <a href="/guide/">攻略</a>
        <a href="/gallery/">圖集</a>
        <a href="/sticker/">貼紙</a>
      </nav>
      <h1>鮭鮭熊</h1>
      <p class="sub">日版 Super Famicom 盒帶正面貼紙 · 生產檔</p>
      <img class="sticker" src="sticker.png" alt="鮭鮭熊超任盒帶貼紙" />
      <p class="spec">
        <b>成品</b> 105 × 37.5 mm　
        <b>出血</b> 四周 3 mm　
        <b>圓角</b> R 3.8 mm　
        <b>解像</b> 600 dpi
      </p>
      <div class="btns">
        <a class="btn" href="SakeKuma-SFC-sticker-production.pdf" download>下載生產 PDF</a>
        <a class="btn gold" href="sticker-bleed.png" download>下載出血 PNG</a>
      </div>

      <section class="making" aria-labelledby="making-title">
        <h2 id="making-title">製作過程</h2>
        <p class="lead">由一張紙仔開始。</p>
        <div class="making-grid" id="making-photos">
          <figure class="making-card">
            <img src="making/making-01.jpg" alt="清潔卡帶殼" width="640" height="480" loading="lazy" />
            <figcaption>親手幫卡帶殼做清潔。</figcaption>
          </figure>
          <figure class="making-card">
            <img src="making/making-02.jpg" alt="舊殼浸泡" width="640" height="480" loading="lazy" />
            <figcaption>舊殼浸好，等佢變返白。</figcaption>
          </figure>
        </div>
        <!-- Extra making photos can be appended inside #making-photos -->
        <div class="making-slot" aria-hidden="true">之後仲可以再加相</div>
      </section>
    </main>
  </body>
</html>
