<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鮭鮭熊 · 超任盒帶貼紙</title>
    <style>
      :root { --ink:#1f2a1c; --green:#24563a; --gold:#b08a3c; --paper:#f4efe4; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:"PingFang TC","Noto Sans TC",sans-serif; background:var(--paper); color:var(--ink); line-height:1.45; }
      main { max-width:920px; margin:0 auto; padding:28px 20px 64px; }
      nav a { color:var(--green); margin-right:14px; text-decoration:none; font-weight:700; }
      h1 { margin:18px 0 6px; font-size:28px; letter-spacing:.08em; color:var(--green); }
      .sub { color:#5a6456; margin-bottom:24px; }
      .sticker { width:100%; height:auto; border-radius:14px; display:block; background:#fff; }
      .spec { margin:20px 0 24px; font-size:15px; }
      .spec b { color:var(--green); }
      .btns { display:flex; flex-wrap:wrap; gap:12px; }
      a.btn { display:inline-block; background:var(--green); color:#fff8e8; text-decoration:none; padding:12px 18px; border-radius:10px; font-weight:700; }
      a.btn.gold { background:var(--gold); color:#1f180c; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="/">遊戲</a>
        <a href="/guide/">攻略</a>
        <a href="/sticker/">貼紙</a>
      </nav>
      <h1>鮭鮭熊</h1>
      <p class="sub">日版 Super Famicom 盒帶正面貼紙 · 生產檔</p>
      <img class="sticker" src="sticker.png" alt="鮭鮭熊超任盒帶貼紙" />
      <p class="spec">
        <b>成品</b> 105 × 37.5 mm　
        <b>出血</b> 四周 3 mm　
        <b>圓角</b> R 3.8 mm　
        <b>解像</b> 600 dpi
      </p>
      <div class="btns">
        <a class="btn" href="SakeKuma-SFC-sticker-production.pdf" download>下載生產 PDF</a>
        <a class="btn gold" href="sticker-bleed.png" download>下載出血 PNG</a>
      </div>
    </main>
  </body>
</html>
