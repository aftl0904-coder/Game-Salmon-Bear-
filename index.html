<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>鮭</text></svg>" />
    <!-- Android / mobile browser HTML play after Vercel deploy -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#3a2818" />
    <meta name="description" content="鮭鮭熊 — 超任風雙人過關（手機瀏覽器可玩）" />
    <title>鮭鮭熊</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1a1428; overflow: hidden; touch-action: none; }
      #game-root { width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- Visible before JS bundle arrives (slow proxies otherwise look “blank forever”). -->
    <div id="boot-splash" style="position:fixed;inset:0;display:grid;place-items:center;background:#3a2818;color:#ffe08a;font-family:sans-serif;z-index:9999">
      <div style="text-align:center">
        <div style="font-size:42px;font-weight:700;letter-spacing:0.08em">鮭鮭熊</div>
        <div id="boot-splash-msg" style="margin-top:14px;font-size:15px;color:#f3e6c8">載入中…</div>
      </div>
    </div>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // If main bundle never boots (proxy hang), surface a real error instead of blank.
      setTimeout(function () {
        var s = document.getElementById('boot-splash-msg')
        if (!window.__SAKE_GAME__ && s) {
          s.textContent = '載入逾時。請重新整理，或用 npm run preview 開正式包。'
          s.style.color = '#ff8866'
        }
      }, 20000)
    </script>
  </body>
</html>
